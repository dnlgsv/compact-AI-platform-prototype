name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: npm test

      - name: Run evals
        run: npm run eval -- --json --output eval-results/latest.json

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results/latest.json
